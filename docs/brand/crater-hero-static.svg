<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">C.R.A.T.E.R. — lunar hazard reconnaissance, from rover camera to Mission Control</title>
  <desc id="heroDesc">Motion-free variant of the C.R.A.T.E.R. hero, generated from crater-readme-hero.svg. A dark mission-control panel. On the left a rover drives across lunar terrain, a sensor bar sweeps the scene and three tracked rocks are marked. On the right the Mission Control dashboard shows the same rocks on a LOCAL_ENU_V1 map beside frame sequence, delivery and spatial-error readouts. Along the bottom a signal path carries binary telemetry frames through six stages — capture, ONNX detection, tracking, projection, binary radio and Mission Control — including a simulated radio blackout where frames queue and are then retransmitted.</desc>

