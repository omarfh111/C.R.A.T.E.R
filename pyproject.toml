[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crater"
version = "0.1.0"
description = "Local rover perception, calibrated localization and constrained telemetry"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "websockets>=15,<16", "opencv-python-headless>=4.10,<6", "pillow>=10,<13", "psutil>=6,<8", "scipy>=1.12,<2"]

[project.optional-dependencies]
ai = ["torch>=2.6,<3", "torchvision>=0.21,<1", "transformers==4.57.1"]
hosted = ["requests>=2.32,<3", "python-dotenv>=1.0,<2"]
spaces = ["requests>=2.32,<3", "python-dotenv>=1.0,<2", "gradio-client==1.13.3", "huggingface-hub==0.36.2"]
onnx-local = ["torch>=2.6,<3", "transformers==4.57.1", "onnx==1.20.1", "onnxruntime-directml==1.24.4; sys_platform == 'win32'", "onnxruntime==1.24.4; sys_platform != 'win32'"]
# pytest 9.0.3 fixes CVE-2025-71176 (PYSEC-2026-1845); requirements-m1.txt already allows 9.x.
test = ["pytest>=8,<10"]
assistant = ["pypdf>=6,<7"]

[project.scripts]
crater-m1 = "crater_m1.cli:main"
crater-m2 = "crater_m2.__main__:main"
crater-assistant = "crater_assistant.__main__:main"

[tool.setuptools.packages.find]
include = ["crater_m1*", "crater_m2*", "crater_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
