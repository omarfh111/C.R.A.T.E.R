name: M1 perception validation
on:
  push:
    branches: [feat/ai-perception, main]
  pull_request:
    paths: ['crater_m1/**', 'tests/m1/**', 'pyproject.toml', '.github/workflows/m1-tests.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install M1 test dependencies
        run: python -m pip install -e '.[test,hosted]' websockets==15.0.1
      - name: Test real image pipeline and M2 localization
        env:
          CRATER_M2_SOURCE: '${{ github.workspace }}'
        run: python -m pytest tests/m1 -q --junitxml=outputs/m1-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-test-results
          path: outputs/m1-tests.xml
