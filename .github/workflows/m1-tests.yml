name: M1 perception validation
on:
  push:
    branches: [feat/ai-perception, main]
  pull_request:
    paths: ['crater_m1/**', 'tests/m1/**', 'pyproject.toml', '.github/workflows/m1-tests.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install M1 test dependencies
        run: python -m pip install -e '.[test]' websockets==15.0.1
      - name: Checkout pinned M2 contract implementation
        uses: actions/checkout@v4
        with:
          repository: omarfh111/C.R.A.T.E.R
          ref: c4e42964ebd9f4c36a935e004d4ca2a7ec46e95b
          path: .m2-reference
      - name: Test real image pipeline and M2 localization
        env:
          CRATER_M2_SOURCE: '${{ github.workspace }}/.m2-reference'
        run: python -m pytest tests/m1 -q --junitxml=outputs/m1-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-test-results
          path: outputs/m1-tests.xml
