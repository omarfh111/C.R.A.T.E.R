name: Browser E2E (Playwright, Chromium)

# Real Chromium against the real M2 WebSocket bridge replaying the committed calibrated ONNX
# recording. Model-free by construction: no ONNX weights, GPU, Ollama, API key or cloud
# service is installed or reachable, and no repository secret is read.
#
# Deliberately narrow. The Python suite, the M2 benchmark and the Vitest suite already run in
# m1-tests.yml, m2-tests.yml and mission-control-ci.yml; this workflow only adds what a browser
# can prove, which is what Mission Control actually displays.

on:
  pull_request:
    branches: [main]
  push:
    branches: [ci/security-e2e, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chromium:
    name: Mission Control in Chromium against live M2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      # Core runtime only: numpy, websockets, opencv-python-headless, pillow, psutil, scipy.
      # No optional ai / onnx-local / hosted / spaces extra is installed.
      - name: Install the model-free M2 package
        run: python -m pip install -e .

      - name: Type-check the browser suite
        run: npm run typecheck:e2e

      # Chromium only, at the revision the pinned @playwright/test resolves to.
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds the production bundle, serves it with `vite preview` on a
      # loopback test port, and each test spawns its own M2 station on a separate loopback port.
      - name: Browser verification
        timeout-minutes: 12
        env:
          CI: 'true'
          CRATER_E2E_PYTHON: python
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: npm run test:e2e

      # Screenshots, traces and the Playwright HTML report for failures.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      # Per-test M2 stdout/stderr logs, delivered-frame JSONL and M2 run reports, plus the
      # JUnit summary and any failure screenshots or traces.
      - name: Upload M2 station logs and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
